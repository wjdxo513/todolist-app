    description: 헬스체크
  - name: Auth
    description: 가입·로그인·토큰 갱신·로그아웃
  - name: Users
    description: 현재 사용자·내 정보
  - name: Categories
    description: 카테고리
  - name: Todos
    description: 할일(목록·CRUD·완료 처리·캘린더 기간 조회)

security:
  - accessTokenCookie: []

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 헬스체크
      description: |
        인증 없음. DB `SELECT 1`까지 확인한다(SP-12). 근거: PRD 8장, SP-12.
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '503':
          description: DB 연결 실패. 코드 `SERVICE_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: 서비스를 일시적으로 사용할 수 없습니다.

  /api/auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: 회원가입
      description: |
        사용자와 '기본' 카테고리(`isDefault=true`)를 한 트랜잭션으로 만든다. 쿠키는 발급하지 않으며(자동 로그인 없음) 클라이언트는 로그인 화면으로 이동한다.
        이메일은 앞뒤 공백 제거·소문자로 정규화되어 고유 비교된다(대소문자만 다른 이메일도 중복).
        근거: FR-01, FR-13, BR-03, BR-06, SN-01, SA-01, SC-01, PP-08.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: user@example.com
              password: password123
              name: 홍길동
      responses:
        '201':
          description: 가입 완료. `Set-Cookie`는 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user@example.com
                name: 홍길동
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 이미 가입된 이메일(BR-03).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: 이미 가입된 이메일입니다.
                  fields:
                    email: 이미 가입된 이메일입니다.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: logIn
      summary: 로그인
      description: |
        성공하면 쿠키 2종(`access_token`, `refresh_token`)을 설정한다. 여러 기기 로그인이 가능하며 로그인마다 Refresh Token이 하나 발급된다(SA-10).
        비밀번호 오류와 없는 이메일은 상태 코드·`code`·본문이 같다(NP-16).

        로그인 시도 제한(D-07): 이메일(소문자 정규화) 단위로 연속 5회 실패하면 5분간 차단한다. 5번째 실패 응답은 401이고 6번째 시도부터 429다.
        차단 중에는 올바른 비밀번호도 거부하고 시도가 차단 시간을 연장하지 않으며, 차단이 풀리면 횟수는 0으로 초기화된다. 5회 미만 실패 뒤 성공하거나 마지막 실패 후 5분이 지나도 초기화된다.
        없는 이메일도 같은 방식으로 집계한다. 시도는 비밀번호 검사 전에 집계되므로 동시에 보낸 요청도 5개까지만 검사되고 나머지는 429다.
        근거: FR-02, FR-13, NFR-10, NFR-11, SN-02, SA-02, SA-03, SP-03, SP-04, SP-08, PP-11, SC-02.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
            example:
              email: user@example.com
              password: password123
      responses:
        '200':
          description: 로그인 성공. 본문에 토큰·해시 없음.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user@example.com
                name: 홍길동
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 이메일 또는 비밀번호 불일치. 로그인 화면 이동(LP-09) 대상이 아니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않습니다.
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 토큰 갱신
      description: |
        인증 미들웨어 없이 `refresh_token` 쿠키만 사용한다(`access_token` 불필요). 요청 본문 없음.
        기존 Refresh Token 행을 삭제하고 새 행을 만든다(rotation). 새 행은 기존 절대 만료(로그인 후 7일)를 이어받아 연장되지 않는다.
        성공하면 새 `access_token`·`refresh_token` 쿠키를 설정한다.
        쿠키가 없거나 임의 값·만료·이미 사용된(갱신·로그아웃으로 삭제된) 토큰이면 401 `UNAUTHENTICATED`이며 두 쿠키를 만료시킨다. 재사용 탐지(계열 폐기)는 하지 않는다.
        같은 토큰으로 동시에 두 번 호출하면 한쪽만 성공한다. 성공 응답은 본문 없는 204.
        단, 새 `refresh_token` 쿠키의 `Max-Age`는 매번 604800(7일)으로 다시 설정되므로 브라우저 쿠키가 서버 만료보다 오래 남을 수 있다(서버 만료 후 갱신은 401).
        근거: FR-02, PA-01, SP-03, SN-03, SN-15, ER-13~ER-15, LP-08, AD-17.
      security:
        - refreshTokenCookie: []
      responses:
        '204':
          description: 갱신 성공. 새 쿠키 2종.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '401':
          description: 갱신 실패(세션 만료·폐기). 두 쿠키를 만료시킨다. 클라이언트는 로그인 화면으로 이동한다(LP-09).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 로그인이 필요합니다.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logOut
      summary: 로그아웃
      description: |
        인증 미들웨어 없이 `refresh_token` 쿠키만 사용한다(Access Token이 만료된 뒤에도 폐기된다). 쿠키의 해시와 일치하는 행만 삭제하므로 다른 기기 세션은 유지된다(SA-10).
        쿠키가 없거나 일치하는 행이 없어도 204이며, 두 쿠키를 발급 때와 같은 속성으로 만료시킨다. DB 오류일 때만 500이다. 요청 본문 없음(본문 파서 오류는 공통 규칙대로 400).
        근거: FR-11, SN-04, SA-05, D-11(해결), SP-03.
      security:
        - refreshTokenCookie: []
        - {}
      responses:
        '204':
          description: 로그아웃 완료(쿠키 유무·일치 여부와 무관).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: 현재 사용자 조회
      description: |
        앱 진입 시 로그인 여부 확인과 SC-03 표시에 쓴다. `/api/auth/*` 밖에 두어 401 시 갱신·재시도(LP-08)가 진입 시에도 동작한다.
        미인증 401은 안내 없이 로그인 화면으로 이동한다(LP-09).
        근거: FR-02, FR-03, SN-03, SN-05, SC-03, 8-plan 10장 불일치 7.
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user@example.com
                name: 홍길동
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      operationId: updateMyName
      summary: 내 정보(이름) 수정
      description: |
        이름만 수정한다. 이메일은 수정할 수 없으며 본문에 `email`을 넣어도 무시된다(AS-05). 비밀번호 변경은 별개 요청이다(WA-06).
        근거: FR-03, FR-13, AS-05, AS-08, SN-05, WA-06, SC-03.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              name: 김철수
      responses:
        '200':
          description: 수정된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me/password:
    put:
      tags: [Users]
      operationId: changeMyPassword
      summary: 비밀번호 변경
      description: |
        현재 비밀번호가 맞을 때만 변경한다. 쿠키는 재발급하지 않으며 변경 후에도 현재 세션은 유지된다(WA-06, PP-22).
        (D-06) 현재 비밀번호 불일치는 400 `VALIDATION_ERROR`와 `fields.currentPassword`다. 401 `UNAUTHENTICATED`가 아니므로 로그인 화면으로 이동하지 않는다(LP-09).
        (D-18) 다른 기기의 Refresh Token은 폐기하지 않는다.
        근거: FR-03, FR-13, BR-12, AS-08, SN-05, WA-06, PP-23.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: password123
              newPassword: newpassword456
      responses:
        '204':
          description: 변경 완료
        '400':
          description: 형식 오류(새 비밀번호 8자 미만·UTF-8 72바이트 초과 등) 또는 현재 비밀번호 불일치.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongCurrentPassword:
                  summary: 현재 비밀번호 불일치(D-06)
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: 입력값을 확인해 주세요.
                      fields:
                        currentPassword: 현재 비밀번호가 일치하지 않습니다.
                tooShort:
                  summary: 새 비밀번호 8자 미만
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: 입력값을 확인해 주세요.
                      fields:
                        newPassword: 비밀번호는 8자 이상이어야 합니다.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: 카테고리 목록
      description: |
        본인 카테고리 전체(기본 포함, `isDefault`로 구분). 페이지 없음. 정렬은 id 오름차순.
        SC-04 목록, SC-05 필터 드롭다운, SC-06 카테고리 선택에 쓴다.
        근거: FR-04, FR-05, FR-06, BR-02, UC-05, SC-04.
      responses:
        '200':
          description: 카테고리 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
              example:
                items:
                  - { id: 1, name: 기본, isDefault: true }
                  - { id: 2, name: 업무, isDefault: false }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: 카테고리 등록
      description: |
        이름은 앞뒤 공백 제거 후 1~20자이며 같은 사용자 안에서 고유하다(대소문자·공백 구분 정확 일치, ER-08). 다른 사용자의 같은 이름은 허용된다.
        '기본'은 이미 기본 카테고리 이름이므로 같은 이름은 중복이다. 근거: FR-04, FR-13, BR-08, BR-09, SN-06, SC-04.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: 업무
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example: { id: 2, name: 업무, isDefault: false }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/CategoryNameDuplicate'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [Categories]
      operationId: renameCategory
      summary: 카테고리 이름 수정
      description: |
        이름만 수정한다. 기본 카테고리는 수정할 수 없다(409). 타인·없는 ID는 같은 404.
        근거: FR-04, FR-13, BR-08, BR-09, SN-06, NFR-06, SC-04.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: 개인
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 같은 이름이 이미 있거나(`CATEGORY_NAME_DUPLICATE`) 기본 카테고리(`DEFAULT_CATEGORY_PROTECTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  value:
                    error:
                      code: CATEGORY_NAME_DUPLICATE
                      message: 이미 같은 이름의 카테고리가 있습니다.
                      fields:
                        name: 이미 같은 이름의 카테고리가 있습니다.
                defaultProtected:
                  value:
                    error:
                      code: DEFAULT_CATEGORY_PROTECTED
                      message: 기본 카테고리는 수정하거나 삭제할 수 없습니다.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: 카테고리 삭제
      description: |
        소속 할일은 삭제되지 않고 사용자의 기본 카테고리로 이동한 뒤 카테고리를 삭제한다(한 트랜잭션, 중간 실패 시 모두 롤백). 기본 카테고리는 삭제할 수 없다(409).
        삭제와 동시에 같은 카테고리에 할일이 붙어 FK 위반(23503)이 나면 409 `CATEGORY_IN_USE`이며 데이터는 변하지 않는다(D-04, ER-04). 재시도하면 된다.
        근거: FR-04, BR-08, BR-10, SN-06, NFR-06, ER-04, SC-04.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 기본 카테고리(`DEFAULT_CATEGORY_PROTECTED`) 또는 동시 변경 충돌(`CATEGORY_IN_USE`, D-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                defaultProtected:
                  value:
                    error:
                      code: DEFAULT_CATEGORY_PROTECTED
                      message: 기본 카테고리는 수정하거나 삭제할 수 없습니다.
                inUse:
                  value:
                    error:
                      code: CATEGORY_IN_USE
                      message: 카테고리가 사용 중이어서 삭제하지 못했습니다. 다시 시도해 주세요.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos:
    get:
      tags: [Todos]
      operationId: listTodos
      summary: 할일 목록(필터·페이지)
      description: |
        `today`는 필수이며 상태 판정 기준일이다. 서버 시계는 쓰지 않는다(PA-06, NP-21). 각 항목에 `status`가 붙는다.
        카테고리 필터와 상태 필터(하나)는 AND다. 정렬은 `endDate`, `createdAt`, `id` 오름차순 고정, 페이지당 50건(ER-05).
        전체 건수 `totalCount`를 포함한다(PP-21). 범위를 넘은 `page`는 빈 `items`의 200이다.
        `categoryId`가 없는 ID·타인 ID면 404 `NOT_FOUND`다(D-09). 정수가 아닌 `categoryId`·`page`, 같은 키를 두 번 보낸 쿼리, 잘못된 상태 값은 400이다.
        근거: FR-06, FR-13, BR-13, AS-06, PA-05, PA-06, PP-06, PP-21, SN-11, NFR-04, SC-05.
      parameters:
        - name: today
          in: query
          required: true
          description: 상태 판정 기준일(클라이언트 로컬 날짜).
          schema:
            type: string
            format: date
          example: '2026-11-04'
        - name: categoryId
          in: query
          required: false
          description: 카테고리 필터. 생략하면 전체.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          description: 상태 필터(하나만). 생략하면 전체.
          schema:
            $ref: '#/components/schemas/TodoStatus'
        - name: page
          in: query
          required: false
          description: 1부터 시작하는 페이지 번호.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
      responses:
        '200':
          description: 할일 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPage'
              example:
                items:
                  - id: 10
                    categoryId: 2
                    title: 기획안
                    memo: null
                    startDate: '2026-10-28'
                    endDate: '2026-11-03'
                    isCompleted: false
                    status: 기한 초과
                    createdAt: '2026-10-27T01:23:45.000Z'
                    updatedAt: '2026-10-27T01:23:45.000Z'
                page: 1
                pageSize: 50
                totalCount: 120
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Todos]
      operationId: createTodo
      summary: 할일 등록
      description: |
        제목·시작일·종료일은 필수이고 종료일 ≥ 시작일이다(같은 날 허용). `categoryId`를 생략하거나 null이면 기본 카테고리에 속한다.
        타인·없는 `categoryId`는 404 `NOT_FOUND`다(PP-18). `memo`는 선택(P1, FR-12)이며 빈 값은 NULL로 저장된다.
        근거: FR-05, FR-12, FR-13, BR-04, BR-05, BR-07, SN-07, PP-18, SC-06.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
            example:
              title: 과제 제출
              categoryId: 2
              startDate: '2026-11-01'
              endDate: '2026-11-03'
      responses:
        '201':
          description: 생성됨. `isCompleted`는 false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: 검증 실패(제목 누락·101자, 날짜 누락·형식·달력 오류, 종료일 < 시작일 등).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요.
                  fields:
                    endDate: 종료일은 시작일보다 빠를 수 없습니다.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/calendar:
    get:
      tags: [Todos]
      operationId: listTodosByPeriod
      summary: 할일 기간(캘린더) 조회
      description: |
        별도 리소스가 아니라 할일의 기간 조회다(PP-14). 조회 범위(`from`~`to`, 양끝 포함)와 기간이 겹치는 본인 할일만 반환한다
        (`startDate <= to` 그리고 `endDate >= from`). 월·주·일 뷰는 클라이언트가 범위를 계산해 보낸다(주는 일~토, AS-09).
        각 항목에 `today` 기준 `status`가 붙고 완료된 할일은 `완료`다. 정렬은 목록과 같은 `endDate`, `createdAt`, `id`.
        (D-08) 페이지·결과 건수 상한은 없고, 대신 범위는 최대 42일이다. `from > to`, 범위 42일 초과, 형식·달력 오류, `today` 누락은 400이다
        (`from > to`·42일 초과는 `fields.to`).
        경로 `calendar`는 `/api/todos/{id}`보다 먼저 매칭된다.
        근거: FR-10, FR-13, BR-13, AS-09, CV-01~05, SN-12, PA-06, NFR-04, AD-07, SC-07.
      parameters:
        - name: from
          in: query
          required: true
          description: 조회 범위 시작일(포함).
          schema:
            type: string
            format: date
          example: '2026-11-01'
        - name: to
          in: query
          required: true
          description: 조회 범위 종료일(포함). `from`과 같거나 이후이며 `from`+41일 이내.
          schema:
            type: string
            format: date
          example: '2026-11-30'
        - name: today
          in: query
          required: true
          description: 상태 판정 기준일(클라이언트 로컬 날짜).
          schema:
            type: string
            format: date
          example: '2026-11-04'
      responses:
        '200':
          description: 범위와 겹치는 할일
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TodoWithStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [Todos]
      operationId: getTodo
      summary: 할일 단건 조회
      description: |
        SC-06 편집 화면의 현재 값 채움에 쓴다. `today`를 받지 않으므로 `status`는 없다. 타인·없는 ID는 같은 404.
        근거: FR-08, BR-02, SN-13, NFR-06, SC-06.
      responses:
        '200':
          description: 할일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Todos]
      operationId: updateTodo
      summary: 할일 수정(전체)
      description: |
        제목·기간·카테고리·완료 여부·메모를 모두 교체한다. 등록과 같은 검증이 적용된다. `categoryId`가 null이거나 생략되면 기본 카테고리가 된다(BR-07).
        `memo` 생략·빈 문자열은 NULL로 저장된다. `updatedAt`이 갱신된다. 타인·없는 할일, 타인·없는 `categoryId`는 같은 404.
        근거: FR-08, FR-12, FR-13, BR-04, BR-05, BR-07, SN-08, SN-13, PP-18, ER-09, SC-06.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
            example:
              title: 과제 제출
              categoryId: null
              startDate: '2026-11-01'
              endDate: '2026-11-05'
              isCompleted: false
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: 할일 삭제
      description: |
        영구 삭제(복구 없음). 확인 절차는 클라이언트 몫이다. 타인·없는 ID는 같은 404.
        근거: FR-09, BR-11, AS-07, SN-10, SN-13, NFR-06, SC-05.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{id}/completion:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    patch:
      tags: [Todos]
      operationId: setTodoCompletion
      summary: 할일 완료 처리 / 해제
      description: |
        (D-05) 전체 수정과 별개인 부분 수정이다. `isCompleted`만 바꾸고 날짜는 건드리지 않아 BR-05 재검증이 필요 없다.
        해제하면 날짜 기준 상태로 재판정된다(목록·캘린더 조회 시). `updatedAt`이 갱신된다. 타인·없는 ID는 같은 404.
        근거: FR-07, BR-13, SN-09, SN-13, WA-10, AD-03, SC-05.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isCompleted]
              properties:
                isCompleted:
                  type: boolean
            example:
              isCompleted: true
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        JWT(HS384, 15분). `HttpOnly; SameSite=Lax; Path=/`(운영 `Secure`). 로그인·갱신 응답의 `Set-Cookie`로 설정된다.
        `HS384` 외 알고리즘(`none` 포함)은 거부된다. 클라이언트는 `credentials: 'include'`로 요청한다.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        불투명 난수 문자열(서버에는 SHA-256 해시만 저장), 절대 만료 7일. `HttpOnly; SameSite=Lax; Path=/api/auth`(운영 `Secure`).
        브라우저는 `/api/auth/*` 요청에만 보낸다. `POST /api/auth/refresh`와 `POST /api/auth/logout`에서만 쓰인다.

  headers:
    SetAuthCookies:
      description: 쿠키 2종 설정. 응답에 `Set-Cookie`가 두 개 온다.
      schema:
        type: array
        items:
          type: string
        example:
          - 'access_token=<JWT>; Max-Age=900; Path=/; Expires=Thu, 05 Nov 2026 02:50:30 GMT; HttpOnly; SameSite=Lax'
          - 'refresh_token=<opaque>; Max-Age=604800; Path=/api/auth; Expires=Thu, 12 Nov 2026 02:35:30 GMT; HttpOnly; SameSite=Lax'
    ClearAuthCookies:
      description: 쿠키 2종 만료. 발급 때와 같은 `Path`·`SameSite`·`HttpOnly`(운영 `Secure`)에 과거 `Expires`로 만료시킨다.
      schema:
        type: array
        items:
          type: string
        example:
          - 'access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax'
          - 'refresh_token=; Path=/api/auth; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax'

  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: 할일 ID. 양의 정수(앞자리 0 불가)가 아니거나 int4 상한을 넘으면 없는 ID와 같은 404(D-10).
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    CategoryId:
      name: id
      in: path
      required: true
      description: 카테고리 ID. 양의 정수(앞자리 0 불가)가 아니거나 int4 상한을 넘으면 없는 ID와 같은 404(D-10).
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647

  responses:
    ValidationError:
      description: |
        입력 오류(FR-13). `fields`에 필드명 → 문구(필드마다 첫 오류 하나). JSON 파싱 오류·본문 크기 초과·지원하지 않는 charset도 이 응답이며 이때는 `fields`가 없다(D-10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: 입력값을 확인해 주세요.
              fields:
                title: 제목은 100자 이하여야 합니다.
    Unauthenticated:
      description: |
        미인증 또는 Access Token 만료·변조. 클라이언트는 `/api/auth/*`가 아니면 `POST /api/auth/refresh` 후 한 번 재시도하고, 갱신도 실패하면 로그인 화면으로 이동한다(LP-08, LP-09).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: 로그인이 필요합니다.
    NotFound:
      description: 없는 리소스, 타인 소유 리소스, 정수가 아닌 경로 ID, 미등록 경로. 모두 코드·메시지·본문이 같다(NFR-06, NP-16).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: 찾을 수 없습니다.
    CategoryNameDuplicate:
      description: 같은 사용자 안에 같은 이름의 카테고리가 있음(BR-09).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CATEGORY_NAME_DUPLICATE
              message: 이미 같은 이름의 카테고리가 있습니다.
              fields:
                name: 이미 같은 이름의 카테고리가 있습니다.
    TooManyAttempts:
      description: 같은 이메일 로그인 연속 5회 실패로 5분간 차단됨. 차단 중에는 올바른 비밀번호도 거부한다(NFR-11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_ATTEMPTS
              message: 로그인 시도가 5회 실패했습니다. 5분 후 다시 시도해 주세요.
    InternalError:
      description: 서버 오류. 내부 정보·스택은 담지 않는다(로그에만 남음).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: 서버 오류가 발생했습니다.

  schemas:
    ErrorCode:
      type: string
      description: |
        안정 식별자. 프론트는 `code`로 분기한다.

        | code | 상태 | 의미 |
        | ---- | ---- | ---- |
        | VALIDATION_ERROR | 400 | 입력 오류(`fields` 포함). 현재 비밀번호 불일치 포함(D-06) |
        | UNAUTHENTICATED | 401 | 미인증·Access 만료·갱신 실패 |
        | INVALID_CREDENTIALS | 401 | 로그인 이메일·비밀번호 불일치(구분 불가) |
        | NOT_FOUND | 404 | 없음·타인 소유·잘못된 경로 ID·미등록 경로 |
        | EMAIL_ALREADY_EXISTS | 409 | 이메일 중복(BR-03) |
        | CATEGORY_NAME_DUPLICATE | 409 | 카테고리 이름 중복(BR-09) |
        | DEFAULT_CATEGORY_PROTECTED | 409 | 기본 카테고리 수정·삭제(BR-08) |
        | CATEGORY_IN_USE | 409 | 카테고리 삭제 중 동시 변경(FK 23503, D-04) |
        | TOO_MANY_ATTEMPTS | 429 | 로그인 차단 |
        | INTERNAL_ERROR | 500 | 서버 오류 |
        | SERVICE_UNAVAILABLE | 503 | 헬스체크 DB 실패(SP-12) |
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - NOT_FOUND
        - EMAIL_ALREADY_EXISTS
        - CATEGORY_NAME_DUPLICATE
        - DEFAULT_CATEGORY_PROTECTED
        - CATEGORY_IN_USE
        - TOO_MANY_ATTEMPTS
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    ErrorResponse:
      type: object
      description: 모든 오류의 공통 형식(NP-15).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 사용자에게 보여도 되는 문구.
            fields:
              type: object
              description: 필드명 → 문구. 입력 오류(400)와 필드가 특정되는 409에만 붙는다. 본문 자체가 객체가 아니면(배열, 또는 Content-Type이 application/json이 아니어서 본문이 없는 경우 등) 키는 `_`다.
              additionalProperties:
                type: string

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          maxLength: 255
          description: 소문자 정규화. 수정 불가.
        name:
          type: string
          minLength: 1
          maxLength: 50
    SignUpRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: 앞뒤 공백 제거·소문자 정규화.
        password:
          type: string
          format: password
          minLength: 8
          description: UTF-8 72바이트 이하(bcrypt 한계, D-15). 초과 시 400.
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백 제거 후 1~50자.
    LogInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 1
    UpdateMeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백 제거 후 1~50자.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 8
          description: UTF-8 72바이트 이하(bcrypt 한계, D-15). 초과 시 400.

    Category:
      type: object
      required: [id, name, isDefault]
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 20
        isDefault:
          type: boolean
          description: 사용자당 1개인 '기본' 카테고리 여부. true면 수정·삭제 불가.
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
          description: 앞뒤 공백 제거 후 1~20자.

    TodoStatus:
      type: string
      description: |
        저장하지 않고 조회 시 `today`와 시작일·종료일·완료 여부로 파생하는 값(BR-13). 판정 순서: 완료 > 기한 초과 > 시작 전 > 진행중(AS-03).
        표기는 도메인 4장의 라벨 그대로다(D-04). 쿼리 파라미터로 쓸 때는 URL 인코딩한다.
      enum: ['시작 전', '진행중', '완료', '기한 초과']
    Todo:
      type: object
      required: [id, categoryId, title, memo, startDate, endDate, isCompleted, createdAt, updatedAt]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 100
        memo:
          type: string
          nullable: true
          maxLength: 1000
          description: 선택(P1, FR-12). 없으면 null.
        startDate:
          type: string
          format: date
          example: '2026-11-01'
        endDate:
          type: string
          format: date
          description: 시작일 이상.
          example: '2026-11-03'
        isCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TodoWithStatus:
      description: 목록·캘린더 항목. `today` 기준 파생 `status`를 포함한다.
      allOf:
        - $ref: '#/components/schemas/Todo'
        - type: object
          required: [status]
          properties:
            status:
              $ref: '#/components/schemas/TodoStatus'
    TodoPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoWithStatus'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum: [50]
          description: 고정 50건(PA-05).
        totalCount:
          type: integer
          minimum: 0
          description: 필터 적용 후 전체 건수(PP-21). 전체 페이지 수는 `ceil(totalCount / pageSize)`.
    TodoCreateRequest:
      type: object
      required: [title, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백 제거 후 1~100자.
        categoryId:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: 생략·null이면 기본 카테고리(BR-07). 본인 카테고리여야 한다(아니면 404).
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: 시작일 이상(같은 날 허용, BR-05).
        memo:
          type: string
          nullable: true
          maxLength: 1000
          description: 선택(P1, FR-12). 빈 값은 null로 저장.
    TodoUpdateRequest:
      type: object
      required: [title, startDate, endDate, isCompleted]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백 제거 후 1~100자.
        categoryId:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
          description: 생략·null이면 기본 카테고리(BR-07).
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: 시작일 이상(BR-05).
        memo:
          type: string
          nullable: true
          maxLength: 1000
          description: 생략·빈 값이면 null로 저장(전체 교체).
        isCompleted:
          type: boolean
