#
# > 본 명세는 `docs/1-domain-definition.md`(v0.4), `docs/2-PRD.md`(v0.7), `docs/3-user-scenario.md`(v0.6), `docs/4-wireframe.md`(v0.5),
# > `docs/5-project-principle.md`(v0.11), `docs/6-arch-diagram.md`(v0.11), `docs/7-erd.md`(v0.6), `docs/8-plan.md`(v0.17), `docs/schema.sql`을 기준으로 한다.
# > 규칙·요구사항은 재정의하지 않고 ID(FR/NFR/BR/SN/SP/PP/AD/ER/D 등)로 참조한다.
#
# ## 엔드포인트 표
#
# 인증 열: Access = `access_token` 쿠키 필요, Refresh = `refresh_token` 쿠키만 사용(인증 미들웨어 없음), - = 인증 없음.
#
# | 영역 | 메서드 | 경로 | 동작 | 인증 | 성공 |
# | ---- | ------ | ---- | ---- | ---- | ---- |
# | 헬스체크 | GET | `/api/health` | 서버·DB 상태 | - | 200 |
# | 인증 | POST | `/api/auth/signup` | 회원가입(기본 카테고리 생성) | - | 201 |
# | 인증 | POST | `/api/auth/login` | 로그인(쿠키 2종 발급) | - | 200 |
# | 인증 | POST | `/api/auth/refresh` | 토큰 갱신(rotation) | Refresh | 204 |
# | 인증 | POST | `/api/auth/logout` | 로그아웃(Refresh 폐기, 항상 204) | Refresh | 204 |
# | 사용자 | GET | `/api/users/me` | 현재 사용자 조회 | Access | 200 |
# | 사용자 | PATCH | `/api/users/me` | 이름 수정 | Access | 200 |
# | 사용자 | PUT | `/api/users/me/password` | 비밀번호 변경 | Access | 204 |
# | 카테고리 | GET | `/api/categories` | 목록 | Access | 200 |
# | 카테고리 | POST | `/api/categories` | 등록 | Access | 201 |
# | 카테고리 | PATCH | `/api/categories/{id}` | 이름 수정 | Access | 200 |
# | 카테고리 | DELETE | `/api/categories/{id}` | 삭제(소속 할일은 기본으로 이동) | Access | 204 |
# | 할일 | GET | `/api/todos` | 목록·필터·페이지(`today` 필수) | Access | 200 |
# | 할일 | POST | `/api/todos` | 등록 | Access | 201 |
# | 할일 | GET | `/api/todos/calendar` | 기간(캘린더) 조회(`from`·`to`·`today` 필수) | Access | 200 |
# | 할일 | GET | `/api/todos/{id}` | 단건 조회 | Access | 200 |
# | 할일 | PUT | `/api/todos/{id}` | 전체 수정 | Access | 200 |
# | 할일 | PATCH | `/api/todos/{id}/completion` | 완료 처리·해제 | Access | 200 |
# | 할일 | DELETE | `/api/todos/{id}` | 삭제(영구) | Access | 204 |
#
# ## FR 매핑
#
# | FR | 요구사항 | 엔드포인트 |
# | -- | -------- | ---------- |
# | FR-01 | 회원가입 | `POST /api/auth/signup` |
# | FR-02 | 로그인·세션 유지 | `POST /api/auth/login`, `POST /api/auth/refresh`, `GET /api/users/me` |
# | FR-03 | 내 정보 조회·수정 | `GET`·`PATCH /api/users/me`, `PUT /api/users/me/password` |
# | FR-04 | 카테고리 등록·수정·삭제 | `GET`·`POST /api/categories`, `PATCH`·`DELETE /api/categories/{id}` |
# | FR-05 | 할일 등록 | `POST /api/todos` |
# | FR-06 | 할일 목록·필터 | `GET /api/todos` |
# | FR-07 | 완료 처리·해제 | `PATCH /api/todos/{id}/completion` |
# | FR-08 | 할일 수정 | `GET`·`PUT /api/todos/{id}` |
# | FR-09 | 할일 삭제 | `DELETE /api/todos/{id}` |
# | FR-10 | 캘린더 조회 | `GET /api/todos/calendar` |
# | FR-11 | 로그아웃 | `POST /api/auth/logout` |
# | FR-12 | 할일 메모(P1) | `POST /api/todos`, `PUT /api/todos/{id}`의 `memo` |
# | FR-13 | 입력값 검증 | 본문·쿼리를 받는 모든 엔드포인트의 400 `VALIDATION_ERROR` |
#
# ## 결정 목록
#
# PRE-02(D-04~D-10)와 BE-07·BE-08 착수 전(D-07·D-18)에 확정했다(8-plan 9장). 본문 description의 "(D-xx)"는 이 표를 가리킨다.
#
# | ID | 항목 | 결정 |
# | -- | ---- | -------------- |
# | D-04 | API 명세 전체 | 이 파일이 유일한 API 계약. 상태 값 표기는 도메인 4장 라벨 그대로(영문 코드 없음) `시작 전`/`진행중`/`완료`/`기한 초과`. 캘린더는 별도 리소스가 아닌 할일 기간 조회로 보고 `GET /api/todos/calendar`(PP-14) |
# | D-04(409) | 409 code 목록 | `EMAIL_ALREADY_EXISTS`(BR-03), `CATEGORY_NAME_DUPLICATE`(BR-09), `DEFAULT_CATEGORY_PROTECTED`(BR-08), `CATEGORY_IN_USE`(ER-04 23503 변환) |
# | D-04(23503) | FK 위반 변환(AD-09, BE-09) | 할일 등록·수정 중 카테고리가 사라진 경우는 404 `NOT_FOUND`, 카테고리 삭제 중 동시에 할일이 붙은 경우는 409 `CATEGORY_IN_USE` |
# | D-05 | 완료 토글 요청 형태(AD-03) | 전체 수정(PUT)과 별개로 부분 수정 `PATCH /api/todos/{id}/completion` `{isCompleted}`. 날짜를 건드리지 않아 BR-05 재검증 불필요 |
# | D-06 | 현재 비밀번호 불일치(AD-04) | 400 `VALIDATION_ERROR`, `fields.currentPassword`. 401을 쓰지 않아 LP-09 이동 규칙과 충돌하지 않음 |
# | D-07 | 로그인 차단 세부(AD-05) | 5번째 연속 실패 시점부터 5분 차단, 차단 중 시도는 차단 시간을 연장하지 않음, 해제 후 횟수 0으로 초기화. 마지막 실패 후 5분 지난 미차단 기록은 삭제(횟수 0). 응답에 `Retry-After`는 두지 않음 |
# | D-08 | 캘린더 상한(AD-07) | 결과 건수 상한 없음, 대신 조회 범위를 최대 42일(월 뷰 6주 그리드)로 제한(초과 시 400). 정렬은 목록과 같은 end_date, created_at, id |
# | D-09 | 없는·타인 categoryId 필터(AD-08) | 404 `NOT_FOUND`(NP-16과 일관). 삭제 후 필터 초기화는 프론트(LP-12) |
# | D-10 | 경로 ID 형식 오류(AD-11), AD-12 | 정수가 아닌 경로 ID는 없는 ID와 같은 404 `NOT_FOUND`. 미등록 경로도 404 `NOT_FOUND`, JSON 파싱 오류·본문 크기 초과(100kb)·지원하지 않는 charset 등 본문 파서의 4xx는 400 `VALIDATION_ERROR`(모두 NP-15 형식) |
# | D-18 | 비밀번호 변경 시 다른 기기 Refresh 폐기(OQ-03) | 폐기하지 않음(현재 세션 유지, WA-06). 다른 기기 세션은 그대로 |
# | PP-21 | 목록 전체 건수 | 포함(`totalCount`). 페이지 번호 방식(WA-09) |
# | 기타 | 응답 형태 | 단일 리소스는 래퍼 없이 객체 그대로, 목록은 `{items}`. 갱신(refresh)·비밀번호 변경은 본문 없는 204. 단건·등록·수정 응답에는 `status`를 넣지 않음(today를 받지 않으므로, PP-06은 목록·캘린더만 규정) |
# | D-15 | 비밀번호 최대 길이 | UTF-8 72바이트(bcrypt가 이후 바이트를 무시하므로). 가입·비밀번호 변경에 적용, 로그인은 상한 없음 |
#
# D-11은 이미 해결되어 반영했다. D-15는 비밀번호 길이가 API에 영향이 있어 위 표에 넣었다(길이 값은 schema.sql 기준). D-12·D-13·D-14·D-16·D-17은 API 형태에 영향이 없어 반영 대상이 아니다.

openapi: 3.0.3
info:
  title: TodoList API
  version: 0.8.0
  description: |
    인증된 사용자가 할일을 카테고리·기간(시작일~종료일)으로 관리하고 월/주/일 캘린더로 조회하는 TodoList 백엔드 API.
    버전 이력은 파일 상단 주석 참조.

    ## 공통 규칙
    - 경로는 `/api/` + 복수 명사(NP-13). 버전 접두는 없다. JSON 키는 camelCase.
    - 날짜는 `YYYY-MM-DD` 문자열(시간·시간대 없음), 시각은 ISO 8601(UTC). 달력상 유효하지 않은 날짜(`2026-02-30`)는 400.
    - 요청 본문·쿼리의 알 수 없는 필드(`id`, `userId`, `isDefault`, `email` 등)는 무시한다(LP-05).
    - 타인 소유 리소스 ID는 없는 ID와 같은 404 `NOT_FOUND`다(NFR-06, NP-16).
    - 보호 API는 인증 → 경로 ID → 본문·쿼리 검증 순서다(D-10). 미인증이면 본문·쿼리 값이 잘못돼도 401이다. 단, JSON 파싱 오류·본문 크기 초과(100kb)·지원하지 않는 charset 등 본문 파서 오류는 모든 경로에서 인증보다 먼저 400 `VALIDATION_ERROR`(fields 없음)다.
    - 요청 본문은 `application/json`, 최대 100kb다.
    - 응답 어디에도 비밀번호·비밀번호 해시·토큰 값이 없다.

    ## 문서 화면 (개발 전용)
    `NODE_ENV=development`일 때만 `GET /api/docs`에서 이 명세의 Swagger UI를 제공한다. `test`·`production`에서는 404다.
    서버 주소가 같은 출처(`/`)라 Try it out으로 로그인한 뒤 보호 API를 그대로 호출할 수 있다(쿠키 사용). 명세를 고치면 서버를 재시작해야 반영된다.

    ## 인증 (PA-01, SP-03, NFR-10)
    - 쿠키 기반이다. 로그인이 쿠키 2종을 설정한다.
      - `access_token`: JWT(HS384), 15분, `HttpOnly; SameSite=Lax; Path=/` (운영 `Secure`)
      - `refresh_token`: 불투명 문자열, 서버 절대 만료 7일, `HttpOnly; SameSite=Lax; Path=/api/auth` (운영 `Secure`)
    - 보호 API는 `access_token`이 없거나 만료·변조면 401 `UNAUTHENTICATED`다. 클라이언트는 `/api/auth/*`가 아닌 요청이 이 401을 받으면
      `POST /api/auth/refresh`를 한 번 호출하고 성공 시 원래 요청을 한 번만 재시도한다(LP-08).
    - `POST /api/auth/refresh`, `POST /api/auth/logout`은 인증 미들웨어 없이 `refresh_token` 쿠키만 쓴다.
    - 이미 발급된 Access Token은 로그아웃·폐기 후에도 최대 15분 유효하다(PA-01 한계).

    ## 에러 형식 (NP-15)
    모든 오류는 `{ "error": { "code", "message", "fields"? } }` 한 형식이다. 프론트는 `code`로 분기한다. 코드 목록은 `ErrorCode` 스키마 참조.

    ## 결정 표시
    "(D-xx)"는 확정한 결정(docs/8-plan.md 9장)이다. 목록은 파일 상단 주석 참조.
servers:
  - url: /
    description: API 서버 자신(Swagger UI와 같은 출처). 프론트는 개발·운영 모두 다른 출처(같은 사이트)에서 CORS로 호출한다(PP-12, 환경 변수 `FRONTEND_ORIGIN`에 쉼표로 지정한 출처만 허용, credentials).
tags:
